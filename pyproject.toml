[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end customer churn prediction: validated data, model selection with MLflow, cost-sensitive thresholds, FastAPI serving, drift monitoring, CI/CD."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
