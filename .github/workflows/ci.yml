name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Train (quality gate)
        run: |
          python -m churn.training.train --quick --no-mlflow --model-dir ci-models --report-dir ci-reports
          python - <<'EOF'
          import json
          m = json.load(open("ci-reports/metrics.json"))
          auc = m["test_metrics"]["roc_auc"]
          print(f"test ROC-AUC = {auc:.4f}")
          assert auc >= 0.80, "model quality regression"
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: ci-reports

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image (uses the committed model)
        run: docker build -t churn-mlops:ci .
      - name: Smoke test
        run: |
          docker run -d --name churn -p 8000:8000 churn-mlops:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"tenure_months":3,"monthly_charges":89.5,"total_charges":268.5,"num_support_tickets":3,"num_services":3,"contract":"Month-to-month","internet_service":"Fiber optic","payment_method":"Electronic check","paperless_billing":"Yes","tech_support":"No","online_security":"No","senior_citizen":"No","partner":"No","dependents":"No","streaming":"Yes"}'
