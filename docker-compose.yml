services:
  api:
    build: .
    image: churn-mlops:latest
    ports:
      - "8000:8000"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
